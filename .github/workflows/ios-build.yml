name: Build iOS App (.IPA) via GitHub Actions

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Application (.ipa)
    runs-on: macos-14 # Máy ảo macOS Apple Silicon M1/M2 của GitHub
    
    steps:
      - name: 1. Tải mã nguồn dự án (Checkout Code)
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Kiểm tra thông tin Xcode trên macOS Runner
        run: |
          xcodebuild -version
          echo "macOS Runner Architecture: $(uname -m)"

      - name: 4. Biên dịch Dự án iOS (xcodebuild Archive)
        run: |
          mkdir -p build
          PROJ="iosApp.xcodeproj"
          if [ -d "iosApp/iosApp.xcodeproj" ]; then
            PROJ="iosApp/iosApp.xcodeproj"
          fi
          echo "Building project: $PROJ"
          xcodebuild clean archive \
            -project "$PROJ" \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/QLTB.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 5. Đóng gói ứng dụng thành tệp .IPA (Payload Packaging)
        run: |
          mkdir -p build/Payload
          # Sao chép file .app được tạo ra trong thư mục Applications vào thư mục Payload
          cp -r build/QLTB.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r QLTB_iOS_v1.0.0.ipa Payload
          ls -lh QLTB_iOS_v1.0.0.ipa

      - name: 6. Xuất bản tệp cài đặt IPA lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QLTB-iOS-App-IPA
          path: build/QLTB_iOS_v1.0.0.ipa
          retention-days: 30
