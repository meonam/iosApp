name: Build iOS App (.IPA) via GitHub Actions

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Application (.ipa)
    runs-on: macos-14 # Máy ảo macOS Apple Silicon M1/M2 của GitHub
    
    steps:
      - name: 1. Tải mã nguồn dự án (Checkout Code)
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Kiểm tra thông tin Xcode trên macOS Runner
        run: |
          xcodebuild -version
          echo "macOS Runner Architecture: $(uname -m)"

      - name: 4. Biên dịch Dự án iOS (xcodebuild Archive)
        run: |
          mkdir -p build
          PROJ="iosApp.xcodeproj"
          if [ -d "iosApp/iosApp.xcodeproj" ]; then
            PROJ="iosApp/iosApp.xcodeproj"
          fi
          echo "Building project: $PROJ"
          xcodebuild clean archive \
            -project "$PROJ" \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/QLTB.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 5. Đóng gói ứng dụng thành tệp .IPA (Payload Packaging)
        run: |
          mkdir -p build/Payload
          cp -r build/QLTB.xcarchive/Products/Applications/*.app build/Payload/
          PROJ="iosApp.xcodeproj"
          if [ -d "iosApp/iosApp.xcodeproj" ]; then
            PROJ="iosApp/iosApp.xcodeproj"
          fi
          VERSION=$(sed -n '/MARKETING_VERSION/{s/.*= *//;s/;//;p;q;}' "$PROJ/project.pbxproj" | tr -d ' ')
          BUILD_NUM=$(sed -n '/CURRENT_PROJECT_VERSION/{s/.*= *//;s/;//;p;q;}' "$PROJ/project.pbxproj" | tr -d ' ')
          [ -z "$VERSION" ] && VERSION="1.2.9"
          [ -z "$BUILD_NUM" ] && BUILD_NUM="129"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$BUILD_NUM" >> $GITHUB_ENV
          IPA_NAME="IT-Service-and-Assets_iOS_v${VERSION}-${BUILD_NUM}.ipa"
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          cd build
          zip -r "$IPA_NAME" Payload
          # Tạo thêm symlink/copy với tên chuẩn dễ tìm
          cp "$IPA_NAME" "IT-Service-and-Assets_iOS_v${VERSION}.ipa"
          ls -lh *.ipa

      - name: 6. Xuất bản tệp cài đặt IPA lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IT-Service-and-Assets-iOS-IPA
          path: build/*.ipa
          retention-days: 30

      - name: 7. Tạo GitHub Release đính kèm tệp IPA
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: build/*.ipa
          name: IT Service & Assets iOS v${{ env.APP_VERSION }} (Build ${{ env.APP_BUILD }})
          tag_name: v${{ env.APP_VERSION }}
          draft: false
          prerelease: false

    
